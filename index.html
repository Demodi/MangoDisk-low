<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mangodisk.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangoDisk</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #fffaf1;
      }

      .startup-screen {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background:
          radial-gradient(circle at 50% 32%, rgb(255 126 0 / 10%), transparent 28%),
          radial-gradient(circle at 68% 18%, rgb(93 154 42 / 4%), transparent 24%), #fffaf1;
        user-select: none;
        -webkit-user-select: none;
      }

      .startup-content {
        display: grid;
        gap: 14px;
        justify-items: center;
        pointer-events: none;
        color: #3a2b23;
        font:
          650 18px/1.2 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        letter-spacing: -0.015em;
      }

      .startup-mark {
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
        border: 1px solid rgb(197 87 0 / 12%);
        border-radius: 28px;
        background: rgb(255 255 255 / 74%);
        box-shadow:
          0 18px 44px rgb(123 61 12 / 10%),
          inset 0 1px 0 rgb(255 255 255 / 82%);
        backdrop-filter: blur(12px);
      }

      .startup-mark img {
        width: 74px;
        height: 74px;
      }

      .startup-progress {
        position: relative;
        overflow: hidden;
        width: 78px;
        height: 3px;
        margin-top: 2px;
        border-radius: 999px;
        background: rgb(197 87 0 / 12%);
      }

      .startup-progress::after {
        position: absolute;
        inset-block: 0;
        left: -45%;
        width: 45%;
        border-radius: inherit;
        animation: startup-progress 1.15s ease-in-out infinite;
        background: linear-gradient(90deg, transparent, #d15b00 34%, #ff8a00 72%, transparent);
        content: '';
      }

      @media (prefers-color-scheme: dark) {
        body,
        .startup-screen {
          background: #211c18;
        }

        .startup-screen {
          background:
            radial-gradient(circle at 50% 32%, rgb(255 126 0 / 13%), transparent 29%),
            radial-gradient(circle at 68% 18%, rgb(100 163 47 / 6%), transparent 24%), #211c18;
        }

        .startup-mark {
          border-color: rgb(255 151 61 / 15%);
          background: rgb(48 40 34 / 76%);
          box-shadow:
            0 18px 44px rgb(0 0 0 / 30%),
            inset 0 1px 0 rgb(255 255 255 / 5%);
        }

        .startup-content {
          color: #f3e9df;
        }

        .startup-progress {
          background: rgb(255 151 61 / 14%);
        }

        .startup-progress::after {
          background: linear-gradient(90deg, transparent, #ff8908 34%, #ffad50 72%, transparent);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-progress::after {
          left: 25%;
          width: 50%;
          animation: none;
          opacity: 0.72;
        }
      }

      @keyframes startup-progress {
        50% {
          left: 50%;
        }

        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-screen" data-tauri-drag-region role="status" aria-label="MangoDisk is starting">
        <div class="startup-content">
          <span class="startup-mark"
            ><img src="/mangodisk.svg" width="74" height="74" fetchpriority="high" alt=""
          /></span>
          <strong>MangoDisk</strong>
          <span class="startup-progress" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script src="/legacy-polyfills.js"></script>
    <script>
      // Diagnostic overlay: surfaces any JS error (incl. module parse/SyntaxError)
      // on screen so a blank window can be diagnosed without devtools.
      (function () {
        function ensure() {
          var el = document.getElementById('fatal-error');
          if (!el) {
            el = document.createElement('div');
            el.id = 'fatal-error';
            el.style.cssText =
              'position:fixed;left:0;top:0;right:0;z-index:2147483647;max-height:100%;' +
              'overflow:auto;background:#1a1010;color:#ff7b7b;' +
              'font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;' +
              'word-break:break-word;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.5)';
            (document.body || document.documentElement).appendChild(el);
          }
          return el;
        }
        function push(msg) {
          var el = ensure();
          el.textContent = (el.textContent ? el.textContent + '\n\n' : '') + msg;
        }
        window.addEventListener('error', function (e) {
          if (e && e.message) {
            push('[error] ' + e.message + (e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
          } else if (e && e.error) {
            push('[error] ' + ((e.error && (e.error.stack || e.error.message)) || e.error));
          } else {
            push('[error] ' + (e && e.type || 'unknown'));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          push('[unhandledrejection] ' + ((r && (r.stack || r.message)) || r || '(no reason)'));
        });

        // Fallback handshake: if the module bundle never mounts (parse error,
        // missing host API, ...), complete resident_main_ready anyway so Rust
        // can reveal this window and the diagnostic text above is readable.
        // Rust's ready() is idempotent, so a duplicate call is harmless.
        var handshakeDone = false;
        function fallbackHandshake() {
          if (handshakeDone) return;
          handshakeDone = true;
          try {
            var internals = window.__TAURI_INTERNALS__;
            if (internals && typeof internals.invoke === 'function') {
              internals.invoke('resident_main_ready', {});
            }
          } catch (e) {
            /* ignore: the overlay still shows the error */
          }
        }
        window.addEventListener('error', fallbackHandshake, true);
        window.addEventListener('unhandledrejection', fallbackHandshake);
        setTimeout(fallbackHandshake, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
